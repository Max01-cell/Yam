<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <!-- kudzu: a growth organism. body of tangled vines, bloom-cluster antenna. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#243620"/>
      <stop offset="100%" stop-color="#161F12"/>
    </radialGradient>
  </defs>

  <!-- antenna stem: curly tendril -->
  <path d="M120 62 C118 44 132 40 136 30 C139 22 133 16 126 18"
        fill="none" stroke="#5d7a4a" stroke-width="4" stroke-linecap="round"/>
  <!-- bloom cluster (kudzu flowers grow in grape-like clusters) -->
  <g fill="#C287E8">
    <circle cx="124" cy="16" r="5"/>
    <circle cx="132" cy="11" r="4.4"/>
    <circle cx="117" cy="10" r="4"/>
    <circle cx="126" cy="6"  r="3.6"/>
    <circle cx="121" cy="23" r="3.4" fill="#8a5fae"/>
  </g>

  <!-- leaf ear -->
  <path d="M58 92 C38 78 34 56 52 46 C56 66 66 76 76 82 Z"
        fill="#3E5C33" stroke="#4E7040" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M52 50 C56 66 64 76 72 81" fill="none" stroke="#7BA05B" stroke-width="2" stroke-linecap="round"/>

  <!-- body: chunky sprout-beast -->
  <path d="M120 60
           C168 60 196 96 194 140
           C193 176 168 202 120 204
           C72 202 47 176 46 140
           C44 96 72 60 120 60 Z"
        fill="url(#glow)" stroke="#3E5C33" stroke-width="5" stroke-linejoin="round"/>

  <!-- vine texture: tangled strokes forming the body -->
  <g fill="none" stroke-linecap="round">
    <path d="M62 120 C86 96 120 100 148 84"  stroke="#3E5C33" stroke-width="4"/>
    <path d="M56 152 C92 132 118 148 172 118" stroke="#4E7040" stroke-width="4"/>
    <path d="M70 182 C104 160 148 176 182 146" stroke="#3E5C33" stroke-width="4"/>
    <path d="M96 198 C120 184 150 192 170 176" stroke="#5d7a4a" stroke-width="3.4"/>
    <path d="M150 70 C166 84 176 104 182 124" stroke="#4E7040" stroke-width="3.4"/>
  </g>
  <!-- tiny leaves budding off the body vines -->
  <g fill="#7BA05B">
    <ellipse cx="88" cy="103" rx="6.5" ry="3.4" transform="rotate(-32 88 103)"/>
    <ellipse cx="163" cy="122" rx="6" ry="3.2" transform="rotate(24 163 122)"/>
    <ellipse cx="118" cy="190" rx="6" ry="3.2" transform="rotate(-12 118 190)"/>
    <ellipse cx="176" cy="158" rx="5.4" ry="3" transform="rotate(40 176 158)"/>
  </g>

  <!-- eyes: big, luminous, slightly feral -->
  <g>
    <ellipse cx="96"  cy="128" rx="17" ry="21" fill="#C9E6A2"/>
    <ellipse cx="146" cy="128" rx="17" ry="21" fill="#C9E6A2"/>
    <circle cx="99"  cy="132" r="8.5" fill="#0E120B"/>
    <circle cx="143" cy="132" r="8.5" fill="#0E120B"/>
    <circle cx="102" cy="128" r="2.6" fill="#C9E6A2"/>
    <circle cx="146" cy="128" r="2.6" fill="#C9E6A2"/>
  </g>

  <!-- mouth: small grin, one fang -->
  <path d="M108 160 C116 168 128 168 136 160" fill="none"
        stroke="#C9E6A2" stroke-width="4" stroke-linecap="round"/>
  <path d="M129 163 L132 170 L135 162 Z" fill="#C9E6A2"/>

  <!-- feet nubs -->
  <g fill="#1C2817" stroke="#3E5C33" stroke-width="3.6">
    <ellipse cx="92"  cy="205" rx="12" ry="8"/>
    <ellipse cx="148" cy="205" rx="12" ry="8"/>
  </g>

  <!-- one escaping tendril: it is always growing -->
  <path d="M191 150 C210 146 214 160 206 168 C200 174 192 170 194 164"
        fill="none" stroke="#7BA05B" stroke-width="3.4" stroke-linecap="round"/>
</svg>
