<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- CONTROLLED DEMOCRATIC FIELD — NOTEBOOK STUDY 009 -->
  <!-- Test: flatten scale variation, distribute directional vectors so no single path dominates -->
  <!-- All figures at near-identical scale. Vectors cancel each other (opposing directions). -->
  <!-- No clustering. Distributed spacing prevents implied narrative grouping. -->
  <!-- Study question: can true democratic reading field be achieved through mark-distribution? -->

  <rect width="800" height="600" fill="white"/>

  <!-- FIGURE A — upper left — facing right, arm raised upward -->
  <!-- Head -->
  <circle cx="110" cy="95" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso -->
  <line x1="110" y1="113" x2="110" y2="185" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm — down at side -->
  <line x1="110" y1="130" x2="88" y2="165" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm — raised upward, vector pointing UP-RIGHT -->
  <line x1="110" y1="130" x2="138" y2="100" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="110" y1="185" x2="92" y2="235" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="110" y1="185" x2="128" y2="235" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- FIGURE B — upper right — seated, facing left, arm extended LEFT -->
  <!-- Head -->
  <circle cx="660" cy="88" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso — seated angle -->
  <line x1="660" y1="106" x2="655" y2="160" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm extended LEFT — vector pointing LEFT -->
  <line x1="660" y1="125" x2="620" y2="118" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm — down -->
  <line x1="660" y1="125" x2="675" y2="155" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Seated legs — splayed, low -->
  <line x1="655" y1="160" x2="630" y2="188" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="655" y1="160" x2="678" y2="188" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- FIGURE C — center-left — standing, arms out BOTH sides equally (vector cancelled) -->
  <!-- Head -->
  <circle cx="270" cy="310" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso -->
  <line x1="270" y1="328" x2="270" y2="400" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm extending LEFT -->
  <line x1="270" y1="348" x2="235" y2="348" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm extending RIGHT — equal and opposite to left -->
  <line x1="270" y1="348" x2="305" y2="348" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="270" y1="400" x2="252" y2="450" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="270" y1="400" x2="288" y2="450" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- FIGURE D — center-right — standing, arms out BOTH sides equally (cancelled) -->
  <!-- Head -->
  <circle cx="530" cy="310" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso -->
  <line x1="530" y1="328" x2="530" y2="400" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left arm -->
  <line x1="530" y1="348" x2="495" y2="348" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Right arm -->
  <line x1="530" y1="348" x2="565" y2="348" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="530" y1="400" x2="512" y2="450" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="530" y1="400" x2="548" y2="450" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- FIGURE E — lower left — crouching, vector pointing DOWN -->
  <!-- Head -->
  <circle cx="130" cy="475" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso — crouching forward -->
  <line x1="130" y1="493" x2="118" y2="535" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms reaching DOWN-FORWARD -->
  <line x1="125" y1="510" x2="105" y2="545" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="125" y1="510" x2="140" y2="548" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Legs bent -->
  <line x1="118" y1="535" x2="100" y2="570" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="118" y1="535" x2="135" y2="568" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- FIGURE F — lower right — walking, vector pointing UP-LEFT (opposing F's down vector) -->
  <!-- Head -->
  <circle cx="668" cy="470" r="18" fill="none" stroke="black" stroke-width="2.5"/>
  <!-- Torso — upright walking -->
  <line x1="668" y1="488" x2="660" y2="555" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arm reaching UP-LEFT — vector pointing UP-LEFT -->
  <line x1="665" y1="508" x2="638" y2="488" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Other arm trailing behind -->
  <line x1="665" y1="508" x2="688" y2="528" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <!-- Stride legs -->
  <line x1="660" y1="555" x2="642" y2="590" stroke="black" stroke-width="2" stroke-linecap="round"/>
  <line x1="660" y1="555" x2="680" y2="585" stroke="black" stroke-width="2" stroke-linecap="round"/>

  <!-- STUDY NOTATION — kept minimal, bottom edge -->
  <!-- Small annotation text as mark not label -->
  <text x="20" y="590" font-family="monospace" font-size="9" fill="#888">009 — controlled field: equal scale, opposing vectors, distributed spacing — does democracy persist?</text>
</svg>